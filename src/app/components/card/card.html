<article class="card">
  <img class="card--image" [src]="place().image" [alt]="place().title" />

  <div class="card--info">
    <div class="card--location">
      <i class="bi bi-geo-alt-fill card--pin"></i>
      <span class="card--country">{{ place().location | uppercase }}</span>

      <a
        class="card--map-link"
        [href]="place().googleMapsUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        View on Google Maps
      </a>
    </div>

    <h2 class="card--title">{{ place().title }}</h2>
    <h3 class="card--dates">{{ place().startDate }} - {{ place().endDate }}</h3>
    <p class="card--description">{{ place().description }}</p>
  </div>
</article>
